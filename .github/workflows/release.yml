name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N for a pre-release) publishes a GitHub Release with
# kuduy-mcp.zip + kuduy-mcp.zip.sha256, which installed sites pick up as an update.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Build (tag must equal plugin version)
        run: php scripts/build-release.php --expect-version="${GITHUB_REF_NAME#v}"

      - name: Built ZIP installs and activates
        run: npm run check:release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/kuduy-mcp.zip build/kuduy-mcp.zip.sha256 "${flags[@]}"

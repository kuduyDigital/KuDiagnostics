name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 php -l

  static:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:static

  integration:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }} / Elementor ${{ matrix.elementor }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One Elementor major per job: 3.x (most existing sites) and current 4.x.
        include:
          - { wp: '6.9', php: '8.1', elementor: '3.35.9', plugins: '', label: '' }
          # Free Elementor add-ons (test matrix EL9), pinned.
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'essential-addons-for-elementor-lite@6.8.8,header-footer-elementor@2.9.6,premium-addons-for-elementor@4.11.117', label: '+ add-ons' }
          # SEO (Phase 6): one SEO plugin per job on both WordPress pairs, plus two at once (conflict, S1).
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'seo-by-rank-math@1.0.281', label: '+ Rank Math' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'seo-by-rank-math@1.0.281', label: '+ Rank Math' }
          # Yoast 28.8 needs WordPress 7.0+; 28.7 is the last release for 6.9 (same APIs as 28.8, RESEARCH.md §9).
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'wordpress-seo@28.7', label: '+ Yoast' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'wordpress-seo@28.8', label: '+ Yoast' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'seo-by-rank-math@1.0.281,wordpress-seo@28.8', label: '+ Rank Math + Yoast (conflict)' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-fund --no-audit
      - run: npm run test:integration
        env:
          KUDUY_WP: ${{ matrix.wp }}
          KUDUY_PHP: ${{ matrix.php }}
          KUDUY_ELEMENTOR: ${{ matrix.elementor }}
          KUDUY_PLUGINS: ${{ matrix.plugins }}

  smoke:
    name: MCP over real HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-fund --no-audit
      - run: npm run smoke:mcp

  package:
    name: Release ZIP installs (WP 6.9 / PHP 8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: php scripts/build-release.php
      - run: npm run check:release
        env:
          KUDUY_WP: '6.9'
          KUDUY_PHP: '8.1'

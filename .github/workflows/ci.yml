name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 php -l

  static:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:static

  integration:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }} / Elementor ${{ matrix.elementor }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One Elementor major per job: 3.x (most existing sites) and current 4.x.
        include:
          - { wp: '6.9', php: '8.1', elementor: '3.35.9', plugins: '', label: '' }
          # Free Elementor add-ons (test matrix EL9), pinned.
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'essential-addons-for-elementor-lite@6.8.8,header-footer-elementor@2.9.6,premium-addons-for-elementor@4.11.117', label: '+ add-ons' }
          # SEO (Phase 6): one SEO plugin per job on both WordPress pairs, plus two at once (conflict, S1).
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'seo-by-rank-math@1.0.281', label: '+ Rank Math' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'seo-by-rank-math@1.0.281', label: '+ Rank Math' }
          # Yoast 28.8 needs WordPress 7.0+; 28.7 is the last release for 6.9 (same APIs as 28.8, RESEARCH.md §9).
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'wordpress-seo@28.7', label: '+ Yoast' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'wordpress-seo@28.8', label: '+ Yoast' }
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'all-in-one-seo-pack@5.0.5', label: '+ AIOSEO' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'all-in-one-seo-pack@5.0.5', label: '+ AIOSEO' }
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'wp-seopress@10.4', label: '+ SEOPress' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'wp-seopress@10.4', label: '+ SEOPress' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'seo-by-rank-math@1.0.281,wordpress-seo@28.8', label: '+ Rank Math + Yoast (conflict)' }
          # WooCommerce (Phase 7): HPOS on and off on both pairs. 11.2.x needs WordPress 7.0; 11.0.1 is the last release for 6.9 (RESEARCH.md §10).
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'woocommerce@11.0.1', hpos: 'on', label: '+ WooCommerce, HPOS on' }
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'woocommerce@11.0.1', hpos: 'off', label: '+ WooCommerce, HPOS off' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'woocommerce@11.2.2', hpos: 'on', label: '+ WooCommerce, HPOS on' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'woocommerce@11.2.2', hpos: 'off', label: '+ WooCommerce, HPOS off' }
          # ACF (Phase 7, D14).
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'advanced-custom-fields@6.8.11', label: '+ ACF' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'advanced-custom-fields@6.8.11', label: '+ ACF' }
          # Forms plugins (Phase 7, D15–D17). CF7 6.2 needs WordPress 7.1, so 6.9 runs 6.1.7.
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'contact-form-7@6.1.7,flamingo@2.6.4,fluentform@6.2.17,wpforms-lite@2.0.4', label: '+ forms' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'contact-form-7@6.2.4.1,flamingo@2.6.4,fluentform@6.2.17,wpforms-lite@2.0.4', label: '+ forms' }
          # Cache plugins (Phase 7, D19): LiteSpeed Cache purges through its own actions.
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'litespeed-cache@7.9.3', label: '+ cache' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'litespeed-cache@7.9.3', label: '+ cache' }
          # Multilingual (Phase 7, D20): Polylang 3.9.2 needs WordPress 6.8+.
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: 'polylang@3.9.2', label: '+ Polylang' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: 'polylang@3.9.2', label: '+ Polylang' }
          # WPBakery Page Builder (D29): paid plugin, so the tools run against a stand-in for its element registry
          # (tests/integration/fakes/wpbakery.php); Elementor stays active to prove both builders coexist.
          - { wp: '6.9', php: '8.1', elementor: '4.3.6', plugins: '', fakes: 'wpbakery', label: '+ WPBakery (stand-in)' }
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: '', fakes: 'wpbakery', label: '+ WPBakery (stand-in)' }
          # Developer mode with D4's constant defined (code tools on).
          - { wp: '7.1', php: '8.3', elementor: '4.3.6', plugins: '', code: '1', label: '+ code tools (D4)' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-fund --no-audit
      - run: npm run test:integration
        env:
          KUDUY_WP: ${{ matrix.wp }}
          KUDUY_PHP: ${{ matrix.php }}
          KUDUY_ELEMENTOR: ${{ matrix.elementor }}
          KUDUY_PLUGINS: ${{ matrix.plugins }}
          KUDUY_HPOS: ${{ matrix.hpos || 'on' }}
          KUDUY_CODE_EXEC: ${{ matrix.code || '0' }}
          KUDUY_FAKES: ${{ matrix.fakes }}

  smoke:
    name: MCP over real HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-fund --no-audit
      - run: npm run smoke:mcp

  package:
    name: Release ZIP installs (WP 6.9 / PHP 8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: php scripts/build-release.php
      - run: npm run check:release
        env:
          KUDUY_WP: '6.9'
          KUDUY_PHP: '8.1'
